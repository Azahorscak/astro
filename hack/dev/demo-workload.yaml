# A workload that matches the `deployment` ruleset in conf-example.yml.
#
# The astro/owner annotation on the Deployment is what makes astro reconcile a
# monitor for it. With no Datadog credentials configured astro stays in dry-run
# and only logs what it would have sent, which is what the smoke test asserts.
---
apiVersion: v1
kind: Namespace
metadata:
  name: astro-demo
  annotations:
    astro/admin: fairwinds
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-demo-workload
  namespace: astro-demo
  annotations:
    astro/owner: astro
  labels:
    app.kubernetes.io/name: astro-demo-workload
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astro-demo-workload
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-demo-workload
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            limits:
              cpu: 10m
              memory: 16Mi
            requests:
              cpu: 10m
              memory: 16Mi
